
configuration:
  dependencies:
    - mvn://com.walmartlabs.concord.plugins:git:2.5.0

flows:
  default:
    - task: git
      in:
        action: CLONE
        url: "https://github.com/Prabinmca7/cp"
        branch: master
        dest: "${workDir}/repo"
    - task: cmd
      in:
        workingDir: "${workDir}/repo"
        cmd: |
          git log -1 --name-only --pretty=format:''







          

