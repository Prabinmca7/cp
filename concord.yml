flows:
  default:
    - task: git
      in:
        # Provide the repository URL here
        repo: "https://github.com/example/repository.git"
        branch: "main"  # Replace with the desired branch
        dest: "${workDir}/repo"  # Directory where the repository will be cloned

    # Get the latest commit details
    - expression: >
        {
          cmd: "git log -1 --name-only",
          cwd: "${workDir}/repo"
        }
      out: {latestCommitFiles: result}

    # Display the commit details in the log
    - log: "Latest commit file details: ${latestCommitFiles.stdout}"