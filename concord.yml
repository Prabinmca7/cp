configuration:
  dependencies:
    # Load the shell plugin
    - mvn://com.walmartlabs.concord.plugins.basic:shell-tasks:2.20.0

flows:
  default:
    - log: "Printing the current working directory..."
    - task: shell
      in:
        cmd: "pwd"
        saveOutput: true
    - log: "PWD is: ${result.stdout}"