configuration:
  arguments:
    webdavUrl: "https://cptest25a118.dv.dev.rightnow.com/dav/cp/"
    jwtAuthToken: ""

flows:
  default:
    - log: "Getting list of changed files from Git"
    - task: exec
      in:
        cmd: "git diff-tree --no-commit-id --name-status -n 1 HEAD~1..HEAD -r"
      out: {stdout: fileChanges}

    - script:
        in:
          webdavUrl: "${webdavUrl}"
          jwtAuthToken: "${jwtAuthToken}"
          fileChanges: "${fileChanges}"
        body: |
          def processFiles(fileChanges, jwtAuthToken, webdavUrl) {
              def filesToUpload = []
              def filesToDelete = []

              // Process each file change
              fileChanges.split('\n').each { change ->
                  def parts = change.split('\t')
                  if (parts.size() != 2) {
                      println("Ignoring malformed line: ${change}")
                      return
                  }
                  def status = parts[0]
                  def path = parts[1]

                  if (status == 'A' || status == 'M') { // Added or Modified
                      println("Queuing file for upload: ${path}")
                      filesToUpload << path
                  } else if (status == 'D') { // Deleted
                      println("Queuing file for deletion: ${path}")
                      filesToDelete << path
                  }
              }

              if (filesToUpload.size() > 0) {
                  uploadFiles(filesToUpload, jwtAuthToken, webdavUrl)
              }

              if (filesToDelete.size() > 0) {
                  deleteFiles(filesToDelete, jwtAuthToken, webdavUrl)
              }
          }

          def uploadFiles(filePaths, jwtAuthToken, webdavUrl) {
              def uploadCommands = filePaths.collect { filePath ->
                  def lastSlash = filePath.lastIndexOf('/')
                  def directory = filePath.substring(0, lastSlash + 1)
                  def fileName = filePath.substring(lastSlash + 1)

                  "-T \"${filePath}\" \"${webdavUrl}${directory}${fileName}\""
              }.join(' ')

              def uploadCommand = "/usr/bin/curl -k --header 'Authorization: Bearer ${jwtAuthToken}' ${uploadCommands}"
              def result = task("exec", cmd: uploadCommand, out: "status")

              if (result.status != 0) {
                  println("Failed to upload files with status ${result.status}")
              } else {
                  println("Successfully uploaded all files")
              }
          }

          def deleteFiles(filePaths, jwtAuthToken, webdavUrl) {
              def deleteCommands = filePaths.collect { filePath ->
                  def lastSlash = filePath.lastIndexOf('/')
                  def directory = filePath.substring(0, lastSlash + 1)
                  def fileName = filePath.substring(lastSlash + 1)

                  "--request DELETE \"${webdavUrl}${directory}${fileName}\""
              }.join(' ')

              def deleteCommand = "/usr/bin/curl -k --header 'Authorization: Bearer ${jwtAuthToken}' ${deleteCommands}"
              def result = task("exec", cmd: deleteCommand, out: "status")

              if (result.status != 0) {
                  println("Failed to delete files with status ${result.status}")
              } else {
                  println("Successfully deleted all files")
              }
          }

          processFiles(fileChanges, jwtAuthToken, webdavUrl)

    - log: "Stage and promote build process in Next stage"
